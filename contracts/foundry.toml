# Foundry 설정(설계서 10.2). 버전은 공식 배포처에서 확인해 고정한다.
# evm_version 은 Besu genesis 가 켠 하드포크(pragueTime: 0)와 맞춘다.
[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.39"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
