# 로컬 환경: Besu QBFT 검증 노드 4개, MySQL 8 (서명 서버는 이후 작업에서 추가)
# 노드 키와 genesis 는 scripts/gen-besu-network.sh 가 deploy/besu/generated/ 에,
# 비밀 파일은 scripts/gen-secrets.sh 가 deploy/secrets/ 에 만든다(둘 다 커밋 금지).
name: sto-kms

x-besu: &besu
  image: hyperledger/besu:26.11.2
  command: ["--config-file=/besu/config.toml"]
  restart: unless-stopped
  healthcheck:
    # 이미지에 curl 이 없어 bash 의 /dev/tcp 로 RPC 포트 열림만 확인한다.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8545"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  besu-node1:
    <<: *besu
    volumes:
      - ./besu/config.toml:/besu/config.toml:ro
      - ./besu/generated/genesis.json:/besu/genesis.json:ro
      - ./besu/generated/node1:/besu/node:ro
      - besu-node1-data:/opt/besu/data
    networks:
      besu:
        ipv4_address: 172.28.0.11
    # 개발용으로 node1 의 RPC 만 호스트 루프백에 바인딩한다(C-1-2).
    ports:
      - "127.0.0.1:8545:8545"

  besu-node2:
    <<: *besu
    volumes:
      - ./besu/config.toml:/besu/config.toml:ro
      - ./besu/generated/genesis.json:/besu/genesis.json:ro
      - ./besu/generated/node2:/besu/node:ro
      - besu-node2-data:/opt/besu/data
    networks:
      besu:
        ipv4_address: 172.28.0.12

  besu-node3:
    <<: *besu
    volumes:
      - ./besu/config.toml:/besu/config.toml:ro
      - ./besu/generated/genesis.json:/besu/genesis.json:ro
      - ./besu/generated/node3:/besu/node:ro
      - besu-node3-data:/opt/besu/data
    networks:
      besu:
        ipv4_address: 172.28.0.13

  besu-node4:
    <<: *besu
    volumes:
      - ./besu/config.toml:/besu/config.toml:ro
      - ./besu/generated/genesis.json:/besu/genesis.json:ro
      - ./besu/generated/node4:/besu/node:ro
      - besu-node4-data:/opt/besu/data
    networks:
      besu:
        ipv4_address: 172.28.0.14

  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
      - api_migrator_password
      - signer_migrator_password
      - api_app_password
      - signer_app_password
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/healthcheck.sh:/usr/local/bin/sto-healthcheck.sh:ro
      - mysql-data:/var/lib/mysql
    networks:
      - db
    # 개발용으로 호스트 루프백에만 바인딩한다(마이그레이션·통합 테스트용).
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/sto-healthcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 60

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  api_migrator_password:
    file: ./secrets/api_migrator_password
  signer_migrator_password:
    file: ./secrets/signer_migrator_password
  api_app_password:
    file: ./secrets/api_app_password
  signer_app_password:
    file: ./secrets/signer_app_password

networks:
  db: {}
  besu:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  mysql-data:
  besu-node1-data:
  besu-node2-data:
  besu-node3-data:
  besu-node4-data:
