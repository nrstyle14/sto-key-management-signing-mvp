# 로컬 환경: Besu QBFT 검증 노드 4개, MySQL 8, 서명 서버(signerd), 업무 서버(apid)
# 기동 순서는 make up 이 정한다: 인프라 → 마이그레이션 → 토큰 초기화·부트스트랩 → signerd, apid
# 노드 키와 genesis 는 scripts/gen-besu-network.sh 가 deploy/besu/generated/ 에,
# 비밀 파일은 scripts/gen-secrets.sh 가 deploy/secrets/ 에, 인증서는 scripts/gen-certs.sh 가 deploy/certs/ 에 만든다(모두 커밋 금지).
name: sto-kms

x-besu: &besu
  image: hyperledger/besu:26.11.2
  command: ["--config-file=/besu/config.toml"]
  restart: unless-stopped
  healthcheck:
    # 이미지에 curl 이 없어 bash 의 /dev/tcp 로 RPC 포트 열림만 확인한다.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8545"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  besu-node1:
    <<: *besu
    volumes:
      - ./besu/config.toml:/besu/config.toml:ro
      - ./besu/generated/genesis.json:/besu/genesis.json:ro
      - ./besu/generated/node1:/besu/node:ro
      - besu-node1-data:/opt/besu/data
    networks:
      besu:
        ipv4_address: 172.28.0.11
    # 개발용으로 node1 의 RPC 만 호스트 루프백에 바인딩한다(C-1-2).
    ports:
      - "127.0.0.1:8545:8545"

  besu-node2:
    <<: *besu
    volumes:
      - ./besu/config.toml:/besu/config.toml:ro
      - ./besu/generated/genesis.json:/besu/genesis.json:ro
      - ./besu/generated/node2:/besu/node:ro
      - besu-node2-data:/opt/besu/data
    networks:
      besu:
        ipv4_address: 172.28.0.12

  besu-node3:
    <<: *besu
    volumes:
      - ./besu/config.toml:/besu/config.toml:ro
      - ./besu/generated/genesis.json:/besu/genesis.json:ro
      - ./besu/generated/node3:/besu/node:ro
      - besu-node3-data:/opt/besu/data
    networks:
      besu:
        ipv4_address: 172.28.0.13

  besu-node4:
    <<: *besu
    volumes:
      - ./besu/config.toml:/besu/config.toml:ro
      - ./besu/generated/genesis.json:/besu/genesis.json:ro
      - ./besu/generated/node4:/besu/node:ro
      - besu-node4-data:/opt/besu/data
    networks:
      besu:
        ipv4_address: 172.28.0.14

  mysql:
    image: mysql:8.4.13
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
    secrets:
      - mysql_root_password
      - api_migrator_password
      - signer_migrator_password
      - api_app_password
      - signer_app_password
    volumes:
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ./mysql/healthcheck.sh:/usr/local/bin/sto-healthcheck.sh:ro
      - mysql-data:/var/lib/mysql
    networks:
      - db
    # 개발용으로 호스트 루프백에만 바인딩한다(마이그레이션·통합 테스트용).
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "bash", "/usr/local/bin/sto-healthcheck.sh"]
      interval: 3s
      timeout: 5s
      retries: 60

  # 서명 서버. 토큰 저장소 볼륨은 이 서비스(와 같은 볼륨을 순서대로 쓰는 signerd-setup)만 마운트한다(D-4).
  # 원장(besu) 네트워크에 붙지 않는다.
  signerd:
    image: sto-kms/signerd:dev
    build:
      context: ..
      dockerfile: deploy/signerd/Dockerfile
      target: runtime
    command: ["serve", "--config", "/etc/sto/signerd.yaml"]
    restart: unless-stopped
    secrets:
      - signer_app_password
      - hsm_pin_platform
      - hsm_pin_inst-a
      - hsm_pin_inst-b
      - hsm_pin_audit
    volumes:
      - ./signerd/signerd.yaml:/etc/sto/signerd.yaml:ro
      - ./certs/ca.crt:/etc/sto/certs/ca.crt:ro
      - ./certs/signerd.crt:/etc/sto/certs/signerd.crt:ro
      - ./certs/signerd.key:/etc/sto/certs/signerd.key:ro
      - signerd-tokens:/var/lib/softhsm/tokens
      # 감사 체크포인트 파일(DB 와 다른 위치). 서명 서버만 마운트한다.
      - signerd-checkpoints:/var/lib/sto/checkpoints
    networks: [db, signer]
    # 개발용으로 호스트 루프백에만 바인딩한다(통합 시험, stoctl 비상 동결).
    ports:
      - "127.0.0.1:8443:8443"
    healthcheck:
      test: ["CMD", "/usr/local/bin/signerd", "healthcheck", "--config", "/etc/sto/signerd.yaml"]
      interval: 3s
      timeout: 5s
      retries: 40

  # 토큰 초기화와 부트스트랩을 한 번씩 실행하는 일회성 서비스. SO PIN 은 여기에만 준다.
  # signerd 가 멈춘 상태에서만 실행한다(scripts/init-signer.sh). 같은 토큰 볼륨을 동시에 쓰지 않는다.
  signerd-setup:
    image: sto-kms/signerd:dev
    profiles: [setup]
    secrets:
      - signer_app_password
      - hsm_pin_platform
      - hsm_pin_inst-a
      - hsm_pin_inst-b
      - hsm_pin_audit
      - hsm_so_pin_platform
      - hsm_so_pin_inst-a
      - hsm_so_pin_inst-b
      - hsm_so_pin_audit
    volumes:
      - ./signerd/signerd.yaml:/etc/sto/signerd.yaml:ro
      - ./signerd/generated/bootstrap.yaml:/etc/sto/bootstrap.yaml:ro
      - signerd-tokens:/var/lib/softhsm/tokens
    networks: [db]

  # 업무 서버. HSM 을 갖지 않는다.
  apid:
    image: sto-kms/apid:dev
    build:
      context: ..
      dockerfile: deploy/apid/Dockerfile
    command: ["serve", "--config", "/etc/sto/apid.yaml"]
    restart: unless-stopped
    secrets:
      - api_app_password
    volumes:
      - ./apid/apid.yaml:/etc/sto/apid.yaml:ro
      - ./certs/ca.crt:/etc/sto/certs/ca.crt:ro
      - ./certs/apid.crt:/etc/sto/certs/apid.crt:ro
      - ./certs/apid.key:/etc/sto/certs/apid.key:ro
    networks: [db, signer, besu]
    ports:
      - "127.0.0.1:9443:9443"
      - "127.0.0.1:9080:9080" # 읽기 전용 웹(D-9)
    healthcheck:
      test: ["CMD", "/usr/local/bin/apid", "healthcheck", "--config", "/etc/sto/apid.yaml"]
      interval: 3s
      timeout: 5s
      retries: 40

secrets:
  mysql_root_password:
    file: ./secrets/mysql_root_password
  api_migrator_password:
    file: ./secrets/api_migrator_password
  signer_migrator_password:
    file: ./secrets/signer_migrator_password
  api_app_password:
    file: ./secrets/api_app_password
  signer_app_password:
    file: ./secrets/signer_app_password
  hsm_pin_platform:
    file: ./secrets/hsm_pin_platform
  hsm_so_pin_platform:
    file: ./secrets/hsm_so_pin_platform
  hsm_pin_inst-a:
    file: ./secrets/hsm_pin_inst-a
  hsm_so_pin_inst-a:
    file: ./secrets/hsm_so_pin_inst-a
  hsm_pin_inst-b:
    file: ./secrets/hsm_pin_inst-b
  hsm_so_pin_inst-b:
    file: ./secrets/hsm_so_pin_inst-b
  hsm_pin_audit:
    file: ./secrets/hsm_pin_audit
  hsm_so_pin_audit:
    file: ./secrets/hsm_so_pin_audit

networks:
  db: {}
  signer: {}
  besu:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  mysql-data:
  signerd-tokens:
  signerd-checkpoints:
  besu-node1-data:
  besu-node2-data:
  besu-node3-data:
  besu-node4-data:
