# Besu 검증 노드 공통 설정(노드별 값은 docker-compose.yml 의 명령행 인자로 준다)
# 가스비 0 구성: Besu 공식 문서 "Configure free gas networks" 절차를 따른다.

genesis-file="/besu/genesis.json"
data-path="/opt/besu/data"
node-private-key-file="/besu/node/key"
profile="ENTERPRISE"

# P2P: 디스커버리를 끄고 정적 피어만 쓴다(외부 공개망 접속 차단).
p2p-port=30303
discovery-enabled=false
static-nodes-file="/besu/node/static-nodes.json"

# JSON-RPC: Compose 내부 네트워크에서만 접근한다. 호스트 바인딩은 compose 에서 node1 만 127.0.0.1 로 한다.
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8545
rpc-http-api=["ETH","NET","WEB3","QBFT","TXPOOL"]
host-allowlist=["*"]

# 가스비 0
min-gas-price=0
tx-pool-enable-balance-check=false

logging="INFO"
